[project]
name = "skyflow"
version = "0.1.0"
description = "A differentiable, fleet-batched JAX quadrotor simulator for reinforcement learning"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Synetic Labs" }]
keywords = ["jax", "quadrotor", "drone", "simulation", "reinforcement-learning", "differentiable"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.4.35",
    "numpy>=1.26",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.4.35"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/Synetic-Labs/SkyFlow"
Repository = "https://github.com/Synetic-Labs/SkyFlow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines: this codebase documents physics inline and wraps by meaning
    "E741",   # `l`/`I` as names: the dynamics follow the paper's notation
]
