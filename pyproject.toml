[project]
name = "skyflow"
version = "0.2.0"
description = "Fleet-batched quadrotor simulator in pure JAX. Physics is generated from the SkyFlow-Dynamics symbolic spec; SkyFlow is the harness: stepping, disturbances, randomization, sensors, vision, tasks."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Synetic Labs" }]
keywords = ["jax", "quadrotor", "drone", "simulation", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "jax>=0.5",
    "numpy>=1.26",
    "skyflow-dynamics[jax]",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.5"]
# Betaflight-in-the-loop (control="sticks"); see DESIGN.md §10. The CPU SITL backend
# needs cudaflight >= 0.2.1 (libcpuflight + aux API).
firmware = ["cudaflight>=0.2.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv.sources]
# Local sibling checkout until published; switch to a git URL on release.
skyflow-dynamics = { path = "../SkyFlow-Dynamics", editable = true }
# Release wheel (binaries are generated artifacts — cudaflight is not pip-installable from
# source). Local vendored copy until the public GitHub release URL replaces it.
cudaflight = { path = "../nav-train/.vendor/cudaflight-0.2.1-py3-none-linux_x86_64.whl" }

[project.urls]
Homepage = "https://github.com/Synetic-Labs/SkyFlow"
Repository = "https://github.com/Synetic-Labs/SkyFlow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",   # long lines: this codebase documents physics inline and wraps by meaning
    "E741",   # `l`/`I` as names: the dynamics follow the paper's notation
]
