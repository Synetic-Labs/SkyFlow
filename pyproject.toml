[project]
name = "skyflow"
version = "0.2.0"
description = "An accurate and fast quadrotor simulator in JAX, fully compiled for pure GPU training."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
authors = [{ name = "Synetic Labs" }]
keywords = ["jax", "quadrotor", "drone", "simulation", "reinforcement-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    # >=0.11.1: the cudaflight wheel's XLA shim is built against jax 0.11.1
    # headers; an older runtime rejects its handlers (CUDA does so silently).
    "jax>=0.11.1",
    "numpy>=2",
    "skyflow-dynamics[jax]",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.11.1"]
# Betaflight-in-the-loop (control="sticks"); see DESIGN.md §10. Floor = 0.6.0:
# render_eeprom with version gate + round-trip verification, plus
# cudaflight.bases (per-base firmware bundles) and the gate trusting the
# booted lib's self-reported base. One wheel per Betaflight base commit
# (the +bf.<hash> in the version); this pin is the canonical 2026.6.1 base
# for SkyFlow's own examples/tests. A drone flashed from a DIFFERENT base
# needs no other wheel: SimConfig.eeprom selects the matching per-base
# binaries from the bundle cache (`python -m cudaflight.bases <rev>`).
firmware = ["cudaflight>=0.6.0"]
# The optional viewer (DESIGN.md §13): live scene/FPV/instruments + flight-log replay.
# pygame-ce is the maintained fork (imports as `pygame`); upstream pygame has no
# wheels for current CPython.
viz = ["pygame-ce>=2.5"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.16"]

[tool.uv.sources]
# Published git source; the editable sibling path is handy for local dynamics work:
# skyflow-dynamics = { path = "../SkyFlow-Dynamics", editable = true }
skyflow-dynamics = { git = "https://github.com/Synetic-Labs/SkyFlow-Dynamics" }
# Public release wheel (binaries are generated artifacts — cudaflight is not
# pip-installable from source, and is not on PyPI). Bump the URL to move versions.
cudaflight = { url = "https://github.com/Synetic-Labs/cudaflight/releases/download/cudaflight-v0.6.0%2Bbf.6dbc4218/cudaflight-0.6.0+bf.6dbc4218-py3-none-manylinux_2_39_x86_64.whl" }

[project.urls]
Homepage = "https://github.com/Synetic-Labs/SkyFlow"
Repository = "https://github.com/Synetic-Labs/SkyFlow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skyflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["gpu: needs a CUDA device (and the cudaflight wheel); skipped otherwise"]

[tool.pyright]
include = ["src", "tests", "examples"]
venvPath = "."
venv = ".venv"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "RUF"]
ignore = [
    "E501",   # long lines: this codebase documents physics inline and wraps by meaning
    "E741",   # `l`/`I` as names: the dynamics follow the paper's notation
]
